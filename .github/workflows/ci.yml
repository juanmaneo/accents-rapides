name: CI

on:
  push:
  pull_request:
  # New RustSec advisories appear without any change on our side.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The only system library needed at build time (pkg-config, for the
      # overlay's layer-shell stack); Wayland, X11 and Vulkan are dlopen'ed.
      # The editor and overlay tests render emoji with a colour emoji font.
      - name: Install libxkbcommon and a colour emoji font
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev fonts-noto-color-emoji
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Installs cargo-llvm-cov itself if missing; prebuilt here to save time.
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo xtask coverage

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The only system library needed at build time (pkg-config, for the
      # overlay's layer-shell stack); Wayland, X11 and Vulkan are dlopen'ed.
      - name: Install libxkbcommon
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Installs the `rust-version` toolchain from Cargo.toml and checks with it.
      - run: cargo xtask msrv

  fcitx5:
    name: Native Fcitx5 addon (${{ matrix.os }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Each container's distribution ships compilers and Fcitx5 that meet the
        # minimums in Cargo.toml [workspace.metadata.cpp]. The runner's own
        # Ubuntu 24.04 does not (GCC 13/14, Clang 18), hence the 26.04 container.
        include:
          - os: arch
            container: archlinux:latest
            install: pacman -Syu --noconfirm --needed base-devel clang fcitx5 pkgconf rustup git
          - os: ubuntu
            container: ubuntu:26.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential clang pkgconf git rustup ca-certificates fcitx5 libfcitx5core-dev fcitx5-modules-dev
          - os: fedora
            container: fedora:latest
            # Fedora's rustup package only ships rustup-init, and the sanitizer
            # runtimes are separate packages.
            install: dnf install -y gcc-c++ clang pkgconf-pkg-config git rustup fcitx5 fcitx5-devel libasan libubsan && rustup-init -y --profile minimal --default-toolchain none
    container: ${{ matrix.container }}
    steps:
      - name: Install the C++ toolchain, Fcitx5 and rustup
        run: ${{ matrix.install }}
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      # `rustup show` installs the toolchain pinned in rust-toolchain.toml; the
      # Ubuntu rustup has no bare `rustup toolchain install`.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Checks the compiler and Fcitx5 versions, builds the addon with both
      # compilers, runs the C ABI test under ASan and UBSan, and the
      # integration test inside Fcitx5 (its testing addons ship with fcitx5).
      - run: cargo xtask fcitx5 test

  freebsd:
    name: FreeBSD (tests and native Fcitx5 addon)
    runs-on: ubuntu-24.04
    steps:
      # The VM plus the LLVM and GCC packages once filled the runner ("No space
      # left on device"): drop preinstalled toolchains this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      # A FreeBSD VM (QEMU) on the Linux runner; the sources are copied in.
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          mem: 8192
          copyback: false
          prepare: |
            # The quarterly package branch is behind the minimum Fcitx5 and
            # LLVM versions of Cargo.toml [workspace.metadata.cpp].
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg update -f
            # Both compilers build against the system's libc++, which the
            # Fcitx5 package is built with.
            # noto-emoji is the colour emoji font the editor tests render with.
            pkg install -y fcitx5 llvm22 gcc16 pkgconf git rustup-init libxkbcommon wayland noto-emoji
            rustup-init -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            cargo test --workspace
            cargo xtask fcitx5 test

  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # `cargo xtask audit` installs missing tools itself; prebuilt binaries
      # just avoid compiling them on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo xtask audit
