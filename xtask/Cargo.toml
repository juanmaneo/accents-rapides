# xtask/Cargo.toml
[package]
name = "xtask"
description = "Developer tasks for accents-rapides (coverage ratchet, security audit, MSRV, Fcitx5 addon)"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# For CONFIG_PATH_ENV, used by `fcitx5 test`.
accents-rapides-core = { path = "../crates/core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
