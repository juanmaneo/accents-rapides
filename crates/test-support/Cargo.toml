# crates/test-support/Cargo.toml
[package]
name = "accents-rapides-test-support"
description = "Shared test helpers for the accents-rapides workspace (dev-dependency only)"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Pixel checks on iced_test snapshots, for the editor and overlay tests only:
# the other crates' tests must not build iced.
snapshot = ["dep:iced_test", "dep:png"]

[dependencies]
accents-rapides-core = { path = "../core" }
iced_test = { version = "0.14", optional = true }
png = { version = "0.18", optional = true }
tempfile = "3.10"
