# crates/core/Cargo.toml
[package]
name = "accents-rapides-core"
description = "Core functionality for accents-rapides"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"
thiserror = "1.0"
tracing = "0.1"
unicode-segmentation = "1.11"
indexmap = { version = "2.2", features = ["serde"] }

[dev-dependencies]
accents-rapides-test-support = { path = "../test-support" }
anyhow = "1.0"
tempfile = "3.10"
