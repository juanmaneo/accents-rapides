# crates/editor/Cargo.toml
[package]
name = "accents-rapides-editor"
description = "Configuration editor for accents-rapides, built with iced"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
accents-rapides-core = { path = "../core" }
accents-rapides-ui = { path = "../ui" }
anyhow = "1.0"
iced.workspace = true
tracing-subscriber = "0.3"

[dev-dependencies]
accents-rapides-test-support = { path = "../test-support", features = ["snapshot"] }
anyhow = "1.0"
assert_cmd = "2.0"
iced_test = "0.14"
predicates = "2.0"
